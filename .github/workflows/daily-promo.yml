# Runs the bot every morning for free on GitHub Actions (public or private repo).
# Add secrets: BUFFER_API_KEY (Zapier webhook secrets optional), OPENAI_API_KEY or ANTHROPIC_API_KEY, HUBSPOT_TOKEN (optional).
name: daily-promo
on:
  # Two tries a day, off the top of the hour (GitHub delays/skips busy :00 runs).
  # A post is only ever sent once: the second run skips anything already in Buffer.
  schedule:
    - cron: "17 13 * * *"   # 7:17 AM Central (standard time)
    - cron: "47 15 * * *"   # 9:47 AM Central backup
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pillow
      - run: python growth.py daily --live
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_WEBHOOK_REELS: ${{ secrets.BUFFER_WEBHOOK_REELS }}
          BUFFER_WEBHOOK_FACEBOOK: ${{ secrets.BUFFER_WEBHOOK_FACEBOOK }}
          BUFFER_WEBHOOK_TIKTOK: ${{ secrets.BUFFER_WEBHOOK_TIKTOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      - name: Save queue status
        if: always()
        run: |
          git config user.name promo-bot && git config user.email promo-bot@users.noreply.github.com
          git add -f out/queue.json && git commit -m "promo: daily run" || true
          git push || true
